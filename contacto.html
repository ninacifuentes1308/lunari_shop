<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Contactanos</title>
</head>
<body>
    <header class="encabezado">
        <div class="logoytitulo">
            <img src="./assets/img/lunarishoplogo.png" alt="logo de Lunari Shop" width="120px" height="120px">
            <h1> Lunari Shop </h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"> Inicio</a></li>
                <li><a href="principal.html"> Tienda</a></li>
                <li><a href="#historia"> Sobre Lunari</a></li>
                <li><a href="contacto.html"> Contactanos</a></li>
                <li><a href="carrito.html"><img src="./assets/img/carrito.png" alt="carrito" width="30px" height="30px"><span id="contador_carrito">0</span> </a></li>
                <li><a href="login.html"><img src="./assets/img/usuario.png" alt="iniciar sesion" width="30px" height="30px"></a></li>
            </ul>
        </nav>
    </header>
    <main class="contacto_form">
        <h1>Contáctanos</h1>
        <p>Para pedidos grandes o personalizados</p>
        <form class="form_contacto">
            <div class="form_dato">
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            <div class="form_dato">
                <label for="email">Correo Electrónico: </label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form_dato">
                <label for="mensaje">Mensaje: </label>
                <textarea name="mensaje" id="mensaje" rows="5" required placeholder="Cuéntanos que necesitas..."></textarea>
            </div>
            <div class="form_dato">
                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="0981546278" pattern="09[0-9]{8}" maxlength="10" minlength="10" required title="Debe tener 10 numeros e iniciar en 09">
            </div>
            <button type="submit" class="btn_principal">Enviar mensaje</button>
        </form>
    </main>
    <footer id="contacto">
        <div class="footer_redes">
            <p>Contactanos mediante nuestras redes sociales:</p>
            <div class="img_footer">
            <a href="mailto:lunari.shop13@gmail.com"><img src="./assets/img/correo.svg" alt="gmail" width="50px" height="50px"></a>
            <a href="https://www.instagram.com/lunari_shop.ec?cplk=NzN2cWhoaWFrZ2Fk" target="_blank"><img src="./assets/img/insta.svg" alt="instagram" width="50px" height="50px"></a>
            <a href="https://wa.me/593999810503?text=Hola%20quiero%20información" target="_blank"><img src="./assets/img/whatsapp.svg" alt="WhatsApp" width="50px" height="50px"></a>
            </div>
        </div>
        <div class="footer_pagos">
            <p>Métodos de pago:</p>
            <div class="img_footer">
            <img src="./assets/img/efectivo.svg" alt="pagos en efectivo" width="50px" height="50px">
            <img src="./assets/img/tarjeta.svg" alt="pagos con tarjeta" width="50px" height="50px">
            </div>
        </div>  
    </footer>
    <script src="main.js"></script>
</body>
</html>
