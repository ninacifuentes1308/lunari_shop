<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>crear cuente</title>
</head>
<body>
    <header class="encabezado">
        <div class="logoytitulo">
            <img src="./assets/img/lunarishoplogo.png" alt="logo de Lunari Shop" width="120px" height="120px">
            <h1> Lunari Shop </h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html"> Inicio</a></li>
                <li><a href="principal.html"> Tienda</a></li>
                <li><a href="#historia"> Sobre Lunari</a></li>
                <li><a href="contacto.html"> Contactanos</a></li>
                <li><a href="carrito.html"><img src="./assets/img/carrito.png" alt="carrito" width="30px" height="30px"><span id="contador_carrito">0</span> </a></li>
                <li><a href="login.html"><img src="./assets/img/usuario.png" alt="iniciar sesion" width="30px" height="30px"></a></li>
            </ul>
        </nav>
    </header>
    <main class="form_registro_inicio">
        <h2>Crea tu cuenta en Lunari ✨</h2>
        <form class="formulario" id="form_registro">
            <div class="form_dato">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form_dato">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
                <small class="error" id="error_correo"></small>
            </div>
            <div class="form_dato password_wrapper">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <small class="error" id="error_password"></small>
                <button type="button" class="contraseña_privada" data-target="password">Mostrar</button>
            </div>
            <div class="form_dato password_wrapper">
                <label for="confirmar">Confirmar contraseña:</label>
                <input type="password" id="confirmar" name="confirmar" required>
                <button type="button" class="contraseña_privada" data-target="confirmar">Mostrar</button>
                <small class="error" id="error_confirmar"></small>
            </div>
            <button type="submit" class="btn_principal">Registrarse</button>
            <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar Sesión</a></p>
        </form>
    </main>
    <footer id="contacto">
        <div class="footer_redes">
            <p>Contactanos mediante nuestras redes sociales:</p>
            <div class="img_footer">
            <a href="mailto:lunari.shop13@gmail.com"><img src="./assets/img/correo.svg" alt="gmail" width="50px" height="50px"></a>
            <a href="https://www.instagram.com/lunari_shop.ec?cplk=NzN2cWhoaWFrZ2Fk" target="_blank"><img src="./assets/img/insta.svg" alt="instagram" width="50px" height="50px"></a>
            <a href="https://wa.me/593999810503?text=Hola%20quiero%20información" target="_blank"><img src="./assets/img/whatsapp.svg" alt="WhatsApp" width="50px" height="50px"></a>
            </div>
        </div>
        <div class="footer_pagos">
            <p>Métodos de pago:</p>
            <div class="img_footer">
            <img src="./assets/img/efectivo.svg" alt="pagos en efectivo" width="50px" height="50px">
            <img src="./assets/img/tarjeta.svg" alt="pagos con tarjeta" width="50px" height="50px">
            </div>
        </div>  
    </footer>
    <script src="main.js"></script>
</body>
</html>
